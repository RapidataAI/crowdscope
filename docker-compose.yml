version: "3.8"

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: crowdscope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/16
    name: crowdscope
    driver_opts:
      com.docker.network.bridge.name: crowdscope
